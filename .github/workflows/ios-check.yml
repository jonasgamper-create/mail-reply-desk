name: iOS Xcode Check

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-check.yml"

jobs:
  build:
    name: Build unsigned iOS targets
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i Xcode || true

      - name: List project
        run: xcodebuild -list -project ios/MailReplyDesk.xcodeproj

      - name: Build app target
        run: |
          xcodebuild \
            -project ios/MailReplyDesk.xcodeproj \
            -target MailReplyDesk \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build keyboard target
        run: |
          xcodebuild \
            -project ios/MailReplyDesk.xcodeproj \
            -target MailReplyKeyboard \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
